        :root {

        .hidden { display: none !important; }

        .auth-wrapper { min-height: 100vh; display: flex; flex-direction: row; }

        .tab-btn.active { background: var(--surface); color: var(--hail-green); box-shadow: var(--shadow-sm); }
        .form-group { margin-bottom: 16px; }

        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .main-container { max-width: 1240px; margin: 0 auto; padding: 28px 24px; }
        .hero-banner { background: var(--hail-green); border-radius: var(--radius-xl); padding: 40px; color: #FFFFFF; margin-bottom: 40px; }
        .landmarks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 24px; margin-bottom: 30px; }
        .landmark-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; }
        .card-media { position: relative; height: 205px; background: #E2E8F0; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 20px; }
