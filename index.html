<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hail360 | Smart Tourism & Heritage Guide</title>
    <style>
        :root {
            --hail-green: #14452F;
            --hail-green-dark: #0D2E1F;
            --hail-gold: #C8963E;
            --hail-gold-light: #F6EEDB;
            --hail-sand: #FAF7F2;
            --surface: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.08);
            --radius-xl: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--hail-sand); color: var(--text-main); line-height: 1.6; }
        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            background: var(--hail-green-dark); color: #fff; padding: 14px 20px;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-weight: 600;
        }
        .auth-wrapper { min-height: 100vh; display: flex; flex-direction: column; }
        @media(min-width: 768px) { .auth-wrapper { flex-direction: row; } }
        .auth-brand-panel { flex: 1; background: var(--hail-green-dark); color: #FFFFFF; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; min-height: 250px; }
        .lang-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); color: #fff; padding: 8px 14px; border-radius: 10px; cursor: pointer; width: fit-content; }
        .auth-form-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--hail-sand); }
        .auth-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 0.92rem; }
        .btn-primary { width: 100%; padding: 14px; background: var(--hail-green); color: #FFFFFF; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-guest { width: 100%; padding: 12px; background: var(--hail-gold-light); color: var(--hail-green-dark); border: 1px solid rgba(200,150,62,0.45); border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 12px; }
        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .main-container { max-width: 1240px; margin: 0 auto; padding: 28px 24px; }
        .hero-banner { background: var(--hail-green); border-radius: var(--radius-xl); padding: 36px; color: #FFFFFF; margin-bottom: 30px; }
        .landmarks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .landmark-card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        
        .card-media { position: relative; height: 190px; background: #E2E8F0; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 18px; }
        .card-title { font-size: 1.1rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
        .card-footer { padding: 0 18px 18px; display: flex; gap: 8px; }
        .btn-card-vr { flex: 1; background: var(--hail-green); color: #FFFFFF; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        .btn-card-booking { flex: 1; background: var(--hail-gold); color: #FFFFFF; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        
        .feature-box { background: var(--surface); border-radius: var(--radius-xl); border: 2px solid var(--hail-gold); padding: 24px; margin-bottom: 30px; box-shadow: var(--shadow-md); }
        .budget-result { margin-top: 14px; padding: 14px; background: var(--hail-gold-light); border-radius: 12px; color: var(--hail-green-dark); font-size: 0.92rem; border: 1px solid rgba(200,150,62,0.4); }
        .chat-messages { height: 200px; background: #F8FAFC; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; overflow-y: auto; margin-bottom: 14px; font-size: 0.9rem; line-height: 1.5; }
        .chat-input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--surface); width: 100%; max-width: 400px; border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div id="toast" class="toast hidden"><span id="toast-text">Action completed</span></div>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="booking-modal-title" style="margin-bottom: 14px; color: var(--hail-green);">حجز موعد الزيارة</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">اختر التاريخ واليوم المناسب لرحلتك:</p>
            <div class="form-group">
                <label>اختر اليوم (Day)</label>
                <select id="booking-day" class="form-control">
                    <option>الأحد (Sunday)</option>
                    <option>الإثنين (Monday)</option>
                    <option>الثلاثاء (Tuesday)</option>
                    <option>الأربعاء (Wednesday)</option>
                    <option>الخميس (Thursday)</option>
                    <option>الجمعة (Friday)</option>
                    <option>السبت (Saturday)</option>
                </select>
            </div>
            <div class="form-group">
                <label>التاريخ (Date)</label>
                <input type="date" id="booking-date" class="form-control" value="2026-11-20">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn-primary" onclick="confirmBooking()">تأكيد الحجز</button>
                <button type="button" class="btn-guest" style="margin-top:0;" onclick="closeBookingModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- AUTHENTICATION -->
    <div id="auth-view" class="auth-wrapper">
        <div class="auth-brand-panel">
            <h1>Hail<span>360</span></h1>
            <p>Smart Heritage & Tourism Platform</p>
            <button type="button" class="lang-btn" onclick="toggleLanguage()">🌐 <span id="lang-label-auth">العربية</span></button>
        </div>
        <div class="auth-form-panel">
            <div class="auth-card">
